<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="cbn-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0F3826" />
      <stop offset="100%" stopColor="#041F14" />
    </radialGradient>
    <linearGradient id="cbn-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="100" cy="100" r="94" fill="url(#cbn-bg)" stroke="#CA8A04" stroke-width="4" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Central Key of Trust & Currency -->
  <circle cx="100" cy="74" r="16" fill="none" stroke="url(#cbn-gold)" stroke-width="6" />
  <rect x="97" y="90" width="6" height="32" rx="2" fill="url(#cbn-gold)" />
  <rect x="103" y="102" width="10" height="4" rx="1.5" fill="url(#cbn-gold)" />
  <rect x="103" y="112" width="14" height="4.5" rx="1.5" fill="url(#cbn-gold)" />

  <!-- CBN Text Banner -->
  <text x="100" y="146" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    CBN
  </text>

  <text x="100" y="165" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FDE047" text-anchor="middle" letter-spacing="1">
    CENTRAL BANK OF NIGERIA
  </text>
  <text x="100" y="177" font-family="'Inter', sans-serif" font-size="7" font-weight="500" fill="#6EE7B7" text-anchor="middle">
    MONETARY STABILITY &amp; INTEGRITY
  </text>
</svg>
