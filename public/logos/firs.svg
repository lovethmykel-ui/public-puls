<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="firs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E3A8A" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <linearGradient id="firs-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#DC2626" />
      <stop offset="100%" stopColor="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="100" cy="100" r="94" fill="url(#firs-grad)" stroke="#DC2626" stroke-width="4" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />

  <!-- Center Crest / Eagle Icon -->
  <circle cx="100" cy="85" r="34" fill="#047857" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Stylized Eagle / Revenue Symbol -->
  <path d="M 100 62 L 108 76 L 118 72 L 112 84 L 122 88 L 108 94 L 100 106 L 92 94 L 78 88 L 88 84 L 82 72 L 92 76 Z" fill="#FBBF24" />

  <!-- FIRS Acronym Banner -->
  <rect x="55" y="125" width="90" height="26" rx="6" fill="url(#firs-red)" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="100" y="143" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    FIRS
  </text>

  <!-- Tagline Text -->
  <text x="100" y="165" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">
    FEDERAL INLAND REVENUE
  </text>
  <text x="100" y="177" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#94A3B8" text-anchor="middle">
    IT PAYS TO PAY TAX
  </text>
</svg>
